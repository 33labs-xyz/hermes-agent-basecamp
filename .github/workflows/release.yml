name: Release (Electron auto-update)

# Cuts a Basecamp release and PUBLISHES it to GitHub Releases so installed apps
# auto-update. Builds the Windows NSIS installer (apps/desktop) and uploads
# latest.yml + the .exe + .blockmap to a GitHub Release named from the
# apps/desktop/package.json version. Already-installed Basecamp builds poll this
# repo's Releases feed via electron-updater (apps/desktop/electron/auto-updater.cjs)
# and prompt testers to "Restart Now" when a newer version is published.
#
# HOW TO CUT A RELEASE:
#   1. Bump "version" in apps/desktop/package.json (e.g. 0.15.1 -> 0.15.2).
#   2. Commit + push that bump to the app branch (feat/projects).
#   3. Run this workflow against that branch:
#        gh workflow run release.yml --ref feat/projects
#      electron-builder builds + signs the installer with --publish never, then a
#      dedicated step creates the v<version> GitHub Release (tag at the built
#      commit) and uploads the .exe + .blockmap + latest.yml with the gh CLI.
#      We do NOT let electron-builder publish: its GitHub publisher creates the
#      release lazily DURING upload, which races the concurrent asset uploads and
#      silently drops the large .exe + latest.yml (only the tiny blockmap
#      survives) while still exiting 0. Uploading via gh is deterministic.
#
# WHY workflow_dispatch and NOT a tag trigger: the first-launch backend bootstrap
# pins to the build's git BRANCH via scripts/write-build-stamp.cjs (GITHUB_REF_NAME).
# A tag push checks out a detached HEAD, which would stamp the branch as the tag
# name and break the in-app backend update channel. Dispatching from the branch
# keeps the stamp = feat/projects, identical to the distributed 0.15.1 build.
#
# WINDOWS ONLY: this workflow builds and uploads the Windows half of a release.
# The MAC half (Basecamp-<ver>-mac-arm64.{zip,dmg} + blockmaps + latest-mac.yml)
# is built LOCALLY on a Mac -- see apps/desktop/RELEASING.md -- and uploaded to
# the SAME v<version> release. Mac auto-update works and depends on it, so a
# release is NOT finished until the Mac assets are attached; skipping them makes
# every installed Mac app 404 on latest-mac.yml.
#
# UNSIGNED: testers still get a one-time SmartScreen "unknown publisher" prompt on
# first install; auto-updates after that download and apply in the background.

on:
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates the GitHub Release + uploads assets

jobs:
  release-windows:
    name: Basecamp Windows NSIS -> GitHub Releases
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # node-pty ships N-API prebuilts; Python is only a node-gyp fallback in case
      # a native dep has to build from source on the runner.
      - name: Setup Python (node-gyp fallback)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      # Root install is mandatory: apps/desktop's build runs
      # scripts/assert-root-install.cjs, which fails if deps were installed from
      # the app subdir instead of the workspace root.
      - name: Install npm dependencies (workspace root)
        run: npm ci

      - name: Build Electron NSIS installer + portable ZIP (no publish)
        working-directory: apps/desktop
        # --publish never: build + sign the NSIS installer and write
        # Basecamp-<ver>-win-x64.exe, its .blockmap, and latest.yml into ./release
        # WITHOUT uploading. The next step uploads them deterministically so we
        # avoid electron-builder's lazy-release-creation race that drops assets.
        # The zip target is the "portable, no installer" download the release page
        # links to; it cannot be cross-built on macOS, so it has to happen here.
        run: npm run build && npm run builder -- --win nsis zip --publish never
        env:
          # Unsigned tester build: skip code-signing identity discovery so the
          # build never blocks on a missing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish GitHub Release + upload Windows assets
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          EXE="release/Basecamp-${VERSION}-win-x64.exe"
          ZIP="release/Basecamp-${VERSION}-win-x64.zip"
          # Fail loudly if electron-builder did not produce every expected asset.
          for f in "$EXE" "${EXE}.blockmap" "$ZIP" "release/latest.yml"; do
            if [ ! -f "$f" ]; then
              echo "Missing expected artifact: $f"
              ls -la release || true
              exit 1
            fi
          done
          # Create the release (and its tag at the built commit) if it is absent.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$VERSION" \
              --notes "Basecamp $VERSION"
            echo "Created release $TAG at $GITHUB_SHA."
          else
            echo "Release $TAG already exists; uploading into it."
          fi
          # --clobber makes re-runs overwrite instead of erroring on duplicates.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$EXE" "${EXE}.blockmap" "$ZIP" "release/latest.yml"
          echo "Uploaded Windows assets to $TAG."

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Basecamp release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- On success: published Windows NSIS + latest.yml to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "- Installed Windows testers are prompted to update on next launch." >> "$GITHUB_STEP_SUMMARY"
